[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[project]
name = "request-server"
version = "1.2.1"
description = "AET Request API Server"
authors = [
    { name = "Magnus Kühne", email = "magnus.kuehne@tum.de" },
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1,<1.0.0",
    "uvicorn[standard]>=0.41.0,<1.0.0",
    "pydantic>=2.12.5,<3.0.0",
    "pydantic-settings>=2.13.1,<3.0.0",
    "sqlalchemy>=2.0.48,<3.0.0",
    "alembic>=1.18.4,<2.0.0",
    "asyncpg>=0.31.0,<1.0.0",
    "greenlet>=3.3.2,<4.0.0",
    "python-jose[cryptography]>=3.5.0,<4.0.0",
    "httpx>=0.28.1,<1.0.0",
    "passlib>=1.7.4,<2.0.0",
    "pydantic[email]>=2.12.5,<3.0.0",
    "opentelemetry-api>=1.33.0,<2.0.0",
    "opentelemetry-sdk>=1.33.0,<2.0.0",
    "opentelemetry-instrumentation-fastapi>=0.54b0,<1.0.0",
    "opentelemetry-instrumentation-sqlalchemy>=0.54b0,<1.0.0",
    "opentelemetry-instrumentation-httpx>=0.54b0,<1.0.0",
    "opentelemetry-instrumentation-logging>=0.54b0,<1.0.0",
    "opentelemetry-exporter-otlp>=1.33.0,<2.0.0",
    "opentelemetry-exporter-prometheus>=0.54b0,<1.0.0",
    "sentry-sdk[fastapi]>=2.56.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.5,<1.0.0",
    "ty>=0.0.21,<1.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]
ci = [
    "ruff>=0.15.5,<1.0.0",
    "ty>=0.0.21,<1.0.0",
    "python-semantic-release>=10.5.0,<11.0.0",
]

[tool.uv.build-backend]
module-root = "."

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults (needed for FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.semantic_release]
branch = "main"
version_toml = ["pyproject.toml:project.version"]
version_variables = ["request_server/__init__.py:__version__"]
changelog_file = "CHANGELOG.md"
commit_message = "chore(release): {version} [skip ci]\n\nAutomatically generated by python-semantic-release"
commit_parser = "conventional"
commit_version_number = true
upload_to_vcs_release = true
