nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

client:
  replicaCount: 2
  image:
    repository: ghcr.io/example/aet-request-client
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  config:
    VITE_API_BASE_URL: /api/v1
    VITE_KEYCLOAK_URL: ""
    VITE_KEYCLOAK_REALM: ""
    VITE_KEYCLOAK_CLIENT_ID: ""
    VITE_ADMIN_ROLE: admin
    VITE_ENVIRONMENT: production
    VITE_WHATS_NEW_ENABLED: "true"
    VITE_GITHUB_URL: ""

server:
  replicaCount: 2
  image:
    repository: ghcr.io/example/aet-request-server
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1
  migration:
    enabled: true
  retention:
    enabled: true
    schedule: "0 3 * * *"    # daily at 3am
    retentionDays: 365
  config:
    APP_NAME: aet-request-server
    DEBUG: "false"
    CORS_ORIGINS: "[]"
    KEYCLOAK_URL: ""
    KEYCLOAK_REALM: ""
    KEYCLOAK_CLIENT_ID: ""
    KEYCLOAK_ADMIN_ROLE: admin
    TICKET_SYSTEM: jira
    SECONDARY_REPORTER_FIELD: customfield_12200
    SERVICE_ACCOUNT_NAME: ""
    JIRA_URL: ""
    JIRA_PROJECT: ""
    REDMINE_URL: ""
    REDMINE_PROJECT: ""
    REDMINE_GROUP_ID: "0"
    REDMINE_TRACKER_ID: "0"
    REDMINE_USERNAME: ""
    GITLAB_URL: ""
  secrets:
    databaseUrl: ""
    jiraUsername: ""
    jiraApiToken: ""
    redmineApiKey: ""
    gitlabToken: ""

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: aet-request.local
      paths:
        api: /api
        app: /
  tls: []
  redirects: []
  redirectAnnotations:
    nginx.ingress.kubernetes.io/permanent-redirect-code: "308"
  redirectTls: []

networkPolicy:
  enabled: false
  ingressController:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ingress-nginx
    podSelector:
      matchLabels:
        app.kubernetes.io/component: controller

postgresql:
  enabled: true
  auth:
    username: aet_request
    database: aet_request
    existingSecret: ""
    password: ""
    postgresPassword: ""
  primary:
    persistence:
      enabled: true
      size: 8Gi
      storageClass: ""
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
